services:
  qbot:
    build:
      context: .
    image: qbot:local
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - "${QBOT_ENV_FILE:-.env}"
    environment:
      HOST: "0.0.0.0"
      PORT: "8092"
    ports:
      - "${QBOT_BIND_IP:-127.0.0.1}:${QBOT_HTTP_PORT:-8092}:8092"
    networks:
      - mysql
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health', timeout=5).close()"
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# 复用现有 MySQL 网络，不创建或管理 MySQL 容器。
networks:
  mysql:
    external: true
    name: "${QBOT_DOCKER_NETWORK:-qbot-network}"
