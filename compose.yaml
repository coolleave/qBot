services:
  qbot:
    build:
      context: .
      args:
        PYTHON_IMAGE: "${QBOT_PYTHON_IMAGE:-m.daocloud.io/docker.io/library/python:3.13-slim-bookworm}"
    image: qbot:local
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - "${QBOT_ENV_FILE:-.env}"
    environment:
      HOST: "0.0.0.0"
      PORT: "8092"
      KNOWLEDGE_STORAGE_DIR: "/app/data/knowledge"
      KNOWLEDGE_QDRANT_URL: "${KNOWLEDGE_QDRANT_URL:-http://qdrant:6333}"
    volumes:
      - "${QBOT_KNOWLEDGE_DIR:-./data/knowledge}:/app/data/knowledge"
    ports:
      - "${QBOT_BIND_IP:-127.0.0.1}:${QBOT_HTTP_PORT:-8092}:8092"
    networks:
      - mysql
      - knowledge
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health', timeout=5).close()"
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:v1.15.1
    profiles: [knowledge]
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - knowledge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qdrant_data:

# 复用现有 MySQL 网络，不创建或管理 MySQL 容器。
networks:
  knowledge:
    internal: true
  mysql:
    external: true
    name: "${QBOT_DOCKER_NETWORK:-qbot-network}"
