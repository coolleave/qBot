[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qbot"
version = "0.1.0"
description = "QQ conversation bot powered by LangChain and DeepSeek"
requires-python = ">=3.11,<3.15"
dependencies = [
  "langchain>=1.4,<2",
  "langchain-deepseek>=1.1,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2,<3",
  "cryptography>=44",
  "httpx>=0.28,<1",
  "SQLAlchemy>=2,<3",
  "PyMySQL>=1.1,<2",
  "langchain-openai>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
qbot = "qbot.__main__:main"

[tool.setuptools.packages.find]
include = ["qbot*"]

[tool.setuptools.package-data]
qbot = ["prompts/*.txt", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
