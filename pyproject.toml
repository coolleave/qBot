[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qbot"
version = "0.5.0"
description = "QQ conversation bot powered by LangChain and DeepSeek"
requires-python = ">=3.11,<3.15"
dependencies = [
  "langchain>=1.4,<2",
  "langchain-deepseek>=1.1,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2,<3",
  "cryptography>=44",
  "httpx>=0.28,<1",
  "websockets>=15,<16",
  "SQLAlchemy>=2,<3",
  "PyMySQL>=1.1,<2",
  "alembic>=1.16,<2",
  "langchain-openai>=1.3,<2",
  "silk-python==0.2.8",
  "Pillow>=11,<13",
  "miniaudio>=1.61,<2",
]

[project.scripts]
qbot = "qbot.__main__:main"

[tool.setuptools.packages.find]
include = ["qbot*"]

[tool.setuptools.package-data]
qbot = ["prompts/*.txt", "prompts/greeting_styles/*.txt", "static/*"]

